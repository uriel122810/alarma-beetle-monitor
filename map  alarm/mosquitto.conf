# ============================================
# Mosquitto Configuration for Alarm Monitor
# ============================================

# ── Standard MQTT Listener ──
listener 1883

# ── WebSocket Listener ──
listener 9001
protocol websockets

# ── Authentication ──
# Create the password file with:
#   mosquitto_passwd -c passwords.txt telemetria
#   (enter password: Seguridad2026)
allow_anonymous false
password_file passwords.txt

# ── Logging ──
log_type all
